<app-dialog-header
  [title]="data.title"
  [icon]="icon()"
  titleClass="warn-title"
  (closeClick)="close(false)" />

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close(false)">{{ cancelLabel() }}</button>
  <button mat-flat-button color="warn" type="button" (click)="close(true)">
    {{ confirmLabel() }}
  </button>
</mat-dialog-actions>
