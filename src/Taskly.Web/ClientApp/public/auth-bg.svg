<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Glow filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-intense" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-text" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Large ambient light pools -->
    <radialGradient id="bg-glow-1" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-3" cx="60%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <!-- Additional light pools for extra brilliance -->
    <radialGradient id="bg-glow-4" cx="40%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-5" cx="90%" cy="15%" r="25%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-6" cx="10%" cy="85%" r="30%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-center" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <!-- Circuit node gradient -->
    <radialGradient id="node-glow">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-glow-cyan">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <!-- Large bloom halos for key nodes -->
    <radialGradient id="bloom-indigo">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom-cyan">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark base -->
  <rect width="1920" height="1080" fill="#080c18"/>

  <!-- Ambient glow areas -->
  <rect width="1920" height="1080" fill="url(#bg-glow-1)"/>
  <rect width="1920" height="1080" fill="url(#bg-glow-2)"/>
  <rect width="1920" height="1080" fill="url(#bg-glow-3)"/>
  <rect width="1920" height="1080" fill="url(#bg-glow-4)"/>
  <rect width="1920" height="1080" fill="url(#bg-glow-5)"/>
  <rect width="1920" height="1080" fill="url(#bg-glow-6)"/>
  <rect width="1920" height="1080" fill="url(#bg-glow-center)"/>

  <!-- Grid pattern -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.5">
    <line x1="120" y1="0" x2="120" y2="1080"/>
    <line x1="240" y1="0" x2="240" y2="1080"/>
    <line x1="360" y1="0" x2="360" y2="1080"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="600" y1="0" x2="600" y2="1080"/>
    <line x1="720" y1="0" x2="720" y2="1080"/>
    <line x1="840" y1="0" x2="840" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1080" y1="0" x2="1080" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1320" y1="0" x2="1320" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1560" y1="0" x2="1560" y2="1080"/>
    <line x1="1680" y1="0" x2="1680" y2="1080"/>
    <line x1="1800" y1="0" x2="1800" y2="1080"/>
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="240" x2="1920" y2="240"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="840" x2="1920" y2="840"/>
    <line x1="0" y1="960" x2="1920" y2="960"/>
  </g>

  <!-- Circuit traces - primary paths (indigo/purple glow) -->
  <g fill="none" stroke="#6366f1" stroke-width="1.8" opacity="0.5" filter="url(#glow-strong)">
    <path d="M0,240 H360 L400,280 H600"/>
    <path d="M1920,360 H1560 L1520,320 H1320 L1280,360 H1080"/>
    <path d="M0,600 H240 L280,560 H480 L520,600 H720"/>
    <path d="M1920,720 H1680 L1640,680 H1440"/>
    <path d="M0,840 H120 L160,880 H360"/>
    <path d="M360,0 V240"/>
    <path d="M600,280 V480 L640,520 V720"/>
    <path d="M1080,360 V600 L1040,640 V840"/>
    <path d="M1440,720 V960"/>
    <path d="M240,600 V840 L280,880 V1080"/>
  </g>

  <!-- Circuit traces - secondary paths (cyan glow) -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.2" opacity="0.35" filter="url(#glow)">
    <path d="M480,0 V120 L520,160 V360"/>
    <path d="M1200,0 V240 L1160,280 V480"/>
    <path d="M840,480 H960 L1000,520 H1200"/>
    <path d="M1680,480 V720 L1640,760 V1080"/>
    <path d="M120,120 H360 L400,160 H600 L640,120 H840"/>
    <path d="M720,840 H960 L1000,880 H1200 L1240,840 H1440"/>
  </g>

  <!-- Extra glowing trace highlights (bright pulses along paths) -->
  <g fill="none" stroke="#a5b4fc" stroke-width="2" opacity="0.2" filter="url(#glow-intense)">
    <path d="M350,240 H420"/>
    <path d="M1100,360 H1300"/>
    <path d="M500,600 H700"/>
    <path d="M1450,720 H1650"/>
    <path d="M600,280 V400"/>
    <path d="M1080,500 V650"/>
  </g>

  <!-- Circuit nodes with large bloom halos -->
  <g>
    <!-- Major nodes with bloom -->
    <circle cx="360" cy="240" r="35" fill="url(#bloom-indigo)"/>
    <circle cx="360" cy="240" r="14" fill="url(#node-glow)"/>
    <circle cx="360" cy="240" r="3.5" fill="#a5b4fc" opacity="0.95"/>

    <circle cx="1080" cy="360" r="35" fill="url(#bloom-indigo)"/>
    <circle cx="1080" cy="360" r="14" fill="url(#node-glow)"/>
    <circle cx="1080" cy="360" r="3.5" fill="#a5b4fc" opacity="0.95"/>

    <circle cx="1440" cy="720" r="35" fill="url(#bloom-indigo)"/>
    <circle cx="1440" cy="720" r="14" fill="url(#node-glow)"/>
    <circle cx="1440" cy="720" r="3.5" fill="#a5b4fc" opacity="0.95"/>

    <!-- Cyan bloom nodes -->
    <circle cx="720" cy="600" r="30" fill="url(#bloom-cyan)"/>
    <circle cx="720" cy="600" r="12" fill="url(#node-glow-cyan)"/>
    <circle cx="720" cy="600" r="3" fill="#67e8f9" opacity="0.9"/>

    <circle cx="240" cy="600" r="28" fill="url(#bloom-cyan)"/>
    <circle cx="240" cy="600" r="12" fill="url(#node-glow-cyan)"/>
    <circle cx="240" cy="600" r="3" fill="#67e8f9" opacity="0.9"/>

    <circle cx="1200" cy="240" r="28" fill="url(#bloom-cyan)"/>
    <circle cx="1200" cy="240" r="12" fill="url(#node-glow-cyan)"/>
    <circle cx="1200" cy="240" r="3" fill="#67e8f9" opacity="0.9"/>

    <!-- Standard nodes -->
    <circle cx="600" cy="280" r="12" fill="url(#node-glow)"/>
    <circle cx="600" cy="280" r="2.5" fill="#818cf8" opacity="0.9"/>

    <circle cx="480" cy="120" r="10" fill="url(#node-glow)"/>
    <circle cx="480" cy="120" r="2" fill="#818cf8" opacity="0.8"/>

    <circle cx="840" cy="840" r="10" fill="url(#node-glow)"/>
    <circle cx="840" cy="840" r="2" fill="#818cf8" opacity="0.8"/>

    <circle cx="1680" cy="480" r="12" fill="url(#node-glow)"/>
    <circle cx="1680" cy="480" r="2.5" fill="#818cf8" opacity="0.9"/>

    <circle cx="600" cy="720" r="10" fill="url(#node-glow-cyan)"/>
    <circle cx="600" cy="720" r="2" fill="#22d3ee" opacity="0.8"/>

    <circle cx="1320" cy="360" r="10" fill="url(#node-glow)"/>
    <circle cx="1320" cy="360" r="2" fill="#818cf8" opacity="0.8"/>

    <!-- Additional lit nodes for more light points -->
    <circle cx="960" cy="520" r="10" fill="url(#node-glow-cyan)"/>
    <circle cx="960" cy="520" r="2" fill="#22d3ee" opacity="0.8"/>

    <circle cx="160" cy="880" r="10" fill="url(#node-glow)"/>
    <circle cx="160" cy="880" r="2" fill="#818cf8" opacity="0.8"/>

    <circle cx="1640" cy="760" r="10" fill="url(#node-glow-cyan)"/>
    <circle cx="1640" cy="760" r="2" fill="#22d3ee" opacity="0.8"/>

    <circle cx="520" cy="160" r="8" fill="url(#node-glow)"/>
    <circle cx="520" cy="160" r="2" fill="#818cf8" opacity="0.8"/>
  </g>

  <!-- Floating code text (subtle) -->
  <g font-family="'Courier New', monospace" fill="#6366f1" opacity="0.12" filter="url(#glow-text)">
    <text x="60" y="80" font-size="11">const taskly = async () =&gt; {</text>
    <text x="60" y="96" font-size="11">  await dispatch(command);</text>
    <text x="60" y="112" font-size="11">  return Result.success(item);</text>
    <text x="60" y="128" font-size="11">};</text>

    <text x="1400" y="160" font-size="11">interface TaskNode {</text>
    <text x="1400" y="176" font-size="11">  id: string;</text>
    <text x="1400" y="192" font-size="11">  status: IssueStatus;</text>
    <text x="1400" y="208" font-size="11">  priority: IssuePriority;</text>
    <text x="1400" y="224" font-size="11">}</text>

    <text x="100" y="420" font-size="10">import { signal, computed } from '@angular/core';</text>
    <text x="100" y="436" font-size="10">const items = signal&lt;TaskItem[]&gt;([]);</text>

    <text x="1300" y="560" font-size="10">export class Pipeline {</text>
    <text x="1300" y="576" font-size="10">  execute(): Result&lt;T&gt; { }</text>
    <text x="1300" y="592" font-size="10">}</text>

    <text x="80" y="940" font-size="11">// Taskly — build the future, one task at a time</text>

    <text x="1500" y="900" font-size="10">[HttpPost, ActionName("create")]</text>
    <text x="1500" y="916" font-size="10">public async Task&lt;IActionResult&gt;</text>
    <text x="1500" y="932" font-size="10">  Create(TaskItemModel model)</text>
  </g>

  <!-- Floating code text - cyan accent -->
  <g font-family="'Courier New', monospace" fill="#22d3ee" opacity="0.08" filter="url(#glow-text)">
    <text x="1100" y="80" font-size="10">fn resolve(ctx: &amp;Context) -&gt; Result</text>
    <text x="800" y="480" font-size="10">SELECT * FROM task_items WHERE status = 'active'</text>
    <text x="200" y="760" font-size="10">git commit -m "feat: implement kanban board"</text>
    <text x="1200" y="1020" font-size="10">docker compose up -d --build</text>
    <text x="60" y="560" font-size="10">&lt;app-kanban-board [items]="tasks()" /&gt;</text>
  </g>

  <!-- Binary streams (very faint) -->
  <g font-family="'Courier New', monospace" fill="#4f46e5" opacity="0.06" font-size="9">
    <text x="40" y="200">01001000 01100101 01101100 01101100 01101111</text>
    <text x="1500" y="440">10110010 01011001 11001010 00110111</text>
    <text x="700" y="320">11010110 00101001 01110100 10001011</text>
    <text x="300" y="680">01100110 01110101 01110100 01110101 01110010 01100101</text>
    <text x="1100" y="800">10010011 01101001 00110010 01010101 11001000</text>
    <text x="900" y="1050">01011001 10110010 01001000 01100101</text>
  </g>

  <!-- Decorative bracket/brace shapes -->
  <g fill="none" stroke="#6366f1" stroke-width="1" opacity="0.08">
    <path d="M1800,50 Q1830,50 1830,80 V160 Q1830,190 1860,190 Q1830,190 1830,220 V300 Q1830,330 1800,330"/>
    <path d="M80,700 Q50,700 50,730 V810 Q50,840 20,840 Q50,840 50,870 V950 Q50,980 80,980"/>
  </g>

  <!-- Small decorative dots scattered -->
  <g fill="#818cf8" opacity="0.15">
    <circle cx="160" cy="160" r="1.5"/>
    <circle cx="520" cy="480" r="1"/>
    <circle cx="880" cy="200" r="1.5"/>
    <circle cx="1040" cy="520" r="1"/>
    <circle cx="1360" cy="640" r="1.5"/>
    <circle cx="1600" cy="280" r="1"/>
    <circle cx="400" cy="920" r="1.5"/>
    <circle cx="760" cy="1000" r="1"/>
    <circle cx="1240" cy="160" r="1"/>
    <circle cx="1560" cy="840" r="1.5"/>
    <circle cx="280" cy="360" r="1"/>
    <circle cx="640" cy="160" r="1"/>
    <circle cx="1000" cy="720" r="1.5"/>
    <circle cx="1480" cy="480" r="1"/>
  </g>

  <!-- Vignette overlay (darkens edges) -->
  <rect width="1920" height="1080" fill="url(#vignette)" opacity="0.6"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#080c18"/>
    </radialGradient>
  </defs>
</svg>
